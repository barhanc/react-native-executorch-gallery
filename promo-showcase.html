<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        --bg-gradient: radial-gradient(circle at 50% 10%, #151d38 0%, #0d1326 60%, #060913 100%);
        --accent: #2a47ff;
        --phone-titanium: #232730;
        --phone-border: #8e95a5;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #0d1326;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        color: #ffffff;
      }
      .header {
        text-align: center;
        margin-bottom: 30px;
      }
      .header img.logo {
        width: 260px;
      }
      .showcase-grid {
        display: grid;
        grid-template-columns: repeat(4, 210px);
        gap: 30px;
        justify-content: center;
      }
      .device-card {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .iphone-frame {
        position: relative;
        width: 200px;
        height: 435px;
        background: #232730;
        border-radius: 36px;
        padding: 6px;
        box-shadow:
          0 16px 32px rgba(0, 0, 0, 0.7),
          0 0 0 1.5px #8e95a5;
      }
      .screen-container {
        width: 100%;
        height: 100%;
        background: #000;
        border-radius: 30px;
        overflow: hidden;
      }
      .screen-media {
        width: 100%;
        height: 100%;
        object-fit: fill;
        display: block;
        border-radius: 30px;
      }
      .device-title {
        margin-top: 12px;
        font-size: 14px;
        font-weight: 700;
        color: #eef0ff;
      }
      .device-subtitle {
        font-size: 11px;
        color: #919fcf;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <picture>
        <source
          media="(prefers-color-scheme: dark)"
          srcset="
            https://github.com/software-mansion/react-native-executorch/raw/main/docs/static/img/logo-vertical-dark.svg
          "
        />
        <img
          src="https://github.com/software-mansion/react-native-executorch/raw/main/docs/static/img/logo-vertical.svg"
          alt="React Native ExecuTorch"
          class="logo"
        />
      </picture>
    </div>

    <div class="showcase-grid">
      <div class="device-card">
        <div class="iphone-frame">
          <div class="screen-container"><img src="media/llm-chat.gif" class="screen-media" /></div>
        </div>
        <div class="device-title">LLM Chat</div>
        <div class="device-subtitle">LFM 2.5 (1.2B)</div>
      </div>
      <div class="device-card">
        <div class="iphone-frame">
          <div class="screen-container">
            <img src="media/text-to-image.gif" class="screen-media" />
          </div>
        </div>
        <div class="device-title">Text to Image</div>
        <div class="device-subtitle">SDXS DreamShaper</div>
      </div>
      <div class="device-card">
        <div class="iphone-frame">
          <div class="screen-container">
            <img src="media/text-to-speech.gif" class="screen-media" />
          </div>
        </div>
        <div class="device-title">Text to Speech</div>
        <div class="device-subtitle">Kokoro TTS (82M)</div>
      </div>
      <div class="device-card">
        <div class="iphone-frame">
          <div class="screen-container"><img src="media/ocr.gif" class="screen-media" /></div>
        </div>
        <div class="device-title">OCR Recognition</div>
        <div class="device-subtitle">PaddleOCR v6</div>
      </div>
      <div class="device-card">
        <div class="iphone-frame">
          <div class="screen-container">
            <img src="media/multimodal-search.gif" class="screen-media" />
          </div>
        </div>
        <div class="device-title">Multimodal Search</div>
        <div class="device-subtitle">CLIP ViT-B/32</div>
      </div>
      <div class="device-card">
        <div class="iphone-frame">
          <div class="screen-container">
            <img src="media/instance-segmentation.gif" class="screen-media" />
          </div>
        </div>
        <div class="device-title">Instance Segmentation</div>
        <div class="device-subtitle">FastSAM</div>
      </div>
      <div class="device-card">
        <div class="iphone-frame">
          <div class="screen-container">
            <img src="media/privacy-filter.gif" class="screen-media" />
          </div>
        </div>
        <div class="device-title">Privacy Filter</div>
        <div class="device-subtitle">PII Redaction</div>
      </div>
      <div class="device-card">
        <div class="iphone-frame">
          <div class="screen-container">
            <img src="media/gallery-menu.gif" class="screen-media" />
          </div>
        </div>
        <div class="device-title">Gallery Overview</div>
        <div class="device-subtitle">14+ Tasks</div>
      </div>
    </div>
  </body>
</html>
